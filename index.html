<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/bookings/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Nanoz Bookings: bookings, customers, leads and team chat for Nanoz.">
  <meta name="theme-color" content="#1D1D1B">
  <meta name="color-scheme" content="light">

  <!-- Installable on phones and desktops ("Add to home screen" / "Install app"). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Bookings">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- The API is the only other host the app talks to: connect early. -->
  <link rel="preconnect" href="https://g59374275735120-nanozprod.adb.me-abudhabi-1.oraclecloudapps.com" crossorigin>

  <title>Nanoz Bookings</title>

  <style>
    html, body { margin: 0; height: 100%; background: #F4F6FA; }
    /* Shown until the app draws its first frame, then removed. */
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: #1D1D1B; transition: opacity .35s ease;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #splash img { width: 132px; height: 132px; border-radius: 28px; }
    #splash .bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(255,198,43,.18); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #FFC62B;
      animation: slide 1.1s ease-in-out infinite;
    }
    #splash p { margin: 0; color: rgba(255,255,255,.6); font-size: 13px; letter-spacing: .04em; }
    #splash.done { opacity: 0; pointer-events: none; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Nanoz Bookings">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
    <p>Loading…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('done');
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script>
    // Start the app. Where the host could not isolate the page (GitHub Pages), coi-sw.js
    // does it: registered once, then one reload so the page comes through it.
    (function () {
      function start() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }
      var key = 'nanoz-coi-reload';
      var canIsolate = window.isSecureContext && 'serviceWorker' in navigator;
      if (window.crossOriginIsolated || !canIsolate) {
        try { sessionStorage.removeItem(key); } catch (e) {}
        return start();
      }
      var tried = false;
      try { tried = sessionStorage.getItem(key) === '1'; } catch (e) {}
      if (tried) {
        // Already reloaded once and still not isolated: run without it (one thread).
        try { sessionStorage.removeItem(key); } catch (e) {}
        return start();
      }
      navigator.serviceWorker.register('coi-sw.js').then(function (reg) {
        if (navigator.serviceWorker.controller) {
          // The worker controls the page but this response predates it: reload once.
          try { sessionStorage.setItem(key, '1'); } catch (e) {}
          return location.reload();
        }
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          try { sessionStorage.setItem(key, '1'); } catch (e) {}
          location.reload();
        });
        // If the worker never takes over, do not keep the user waiting.
        setTimeout(start, 4000);
      }, start);
    })();
  </script>
</body>
</html>
